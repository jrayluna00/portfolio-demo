baseURL = 'https://jrayluna.github.io/'
languageCode = 'en-us'
title = 'My Portfolio & Blog'
theme = 'PaperMod'

[params]
  author = 'Your Name'
  description = 'My portfolio and tech blog'
  ShowReadingTime = true
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true

[params.homeInfoParams]
  Title = "Hi there 👋"
  Content = "Welcome to my portfolio and blog where I share my projects and thoughts on technology."

[[params.socialIcons]]
  name = "github"
  url = "https://github.com/yourusername"

[[params.socialIcons]]
  name = "linkedin"
  url = "https://linkedin.com/in/yourprofile"

[menu]
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 1
  
  [[menu.main]]
    name = 'Projects'
    url = '/projects/'
    weight = 2
  
  [[menu.main]]
    name = 'About'
    url = '/about/'
    weight = 3

  [[menu.main]]
    name = 'Search'
    url = '/search/'
    weight = 4

[outputs]
  home = ["HTML", "RSS", "JSON"]